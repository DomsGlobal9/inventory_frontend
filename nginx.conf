# Serves the built app. The same rules vercel.json gives it on Vercel, plus caching and headers.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # Vite names built files by their content, so a changed file is a new name: safe to keep a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Every app route (/orders/new-sale, /customers/…) is the same page; the router in the browser
  # picks the screen. Without this a reload on any page but / is a 404.
  location / {
    # index.html is never cached, so a deploy reaches people on their next page load.
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /index.html;
  }
}
