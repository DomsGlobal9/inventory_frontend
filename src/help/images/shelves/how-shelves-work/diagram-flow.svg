<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 560" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-label="How pieces move: a delivery arrives as Not shelved, you put it away on a shelf, and from the shelf it is sold at the counter, picked for an online order, or moved to another shelf.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#164B1E"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker>
  </defs>
  <rect width="1520" height="560" rx="20" fill="#fafafa"/>

  <g text-anchor="middle">
    <!-- delivery -->
    <rect x="40" y="100" width="240" height="170" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <circle cx="160" cy="146" r="22" fill="#eef5e6"/>
    <path d="M146 138 h28 v18 h-28 z M146 138 l14 -8 l14 8" stroke="#164B1E" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <text x="160" y="198" fill="#18181b" font-size="19" font-weight="700">Goods arrive</text>
    <text x="160" y="224" fill="#71717a" font-size="15">delivery, transfer</text>
    <text x="160" y="246" fill="#71717a" font-size="15">or a customer return</text>

    <!-- not shelved -->
    <rect x="350" y="100" width="240" height="170" rx="16" fill="#ffffff" stroke="#71717a" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="470" y="170" fill="#18181b" font-size="21" font-weight="700">Not shelved</text>
    <text x="470" y="200" fill="#71717a" font-size="15">in the store,</text>
    <text x="470" y="222" fill="#71717a" font-size="15">but on no shelf yet</text>

    <!-- put away -->
    <rect x="660" y="100" width="240" height="170" rx="16" fill="#164B1E"/>
    <text x="780" y="168" fill="#ffffff" font-size="21" font-weight="700">Put away</text>
    <text x="780" y="198" fill="#d9f99d" font-size="15">scan the item,</text>
    <text x="780" y="220" fill="#d9f99d" font-size="15">then the shelf label</text>

    <!-- on a shelf -->
    <rect x="970" y="100" width="220" height="170" rx="16" fill="#ffffff" stroke="#164B1E" stroke-width="2.5"/>
    <text x="1080" y="160" fill="#18181b" font-size="21" font-weight="700">On a shelf</text>
    <rect x="1000" y="182" width="160" height="40" rx="8" fill="#eef7d6" stroke="#A6D92B" stroke-width="2"/>
    <text x="1080" y="209" fill="#164B1E" font-size="19" font-weight="800" font-family="Consolas, Menlo, monospace">FLOOR-C1-1</text>
    <text x="1080" y="248" fill="#71717a" font-size="15">anyone can find it</text>

    <!-- outs -->
    <rect x="1270" y="40" width="210" height="84" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="1375" y="76" fill="#18181b" font-size="17" font-weight="700">Sold at the counter</text>
    <text x="1375" y="101" fill="#71717a" font-size="14">taken off automatically</text>
    <rect x="1270" y="143" width="210" height="84" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="1375" y="179" fill="#18181b" font-size="17" font-weight="700">Picked</text>
    <text x="1375" y="204" fill="#71717a" font-size="14">for an online order</text>
    <rect x="1270" y="246" width="210" height="84" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="1375" y="282" fill="#18181b" font-size="17" font-weight="700">Moved</text>
    <text x="1375" y="307" fill="#71717a" font-size="14">to another shelf</text>
  </g>

  <!-- arrows -->
  <path d="M282 185 H346" stroke="#164B1E" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M592 185 H656" stroke="#164B1E" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M902 185 H966" stroke="#164B1E" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1192 170 C 1230 170, 1230 82, 1266 82" stroke="#164B1E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M1192 185 H1266" stroke="#164B1E" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1192 200 C 1230 200, 1230 288, 1266 288" stroke="#164B1E" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <!-- moved goes back onto a shelf -->
  <path d="M1375 332 C 1375 380, 1080 380, 1080 274" stroke="#a1a1aa" stroke-width="2.5" stroke-dasharray="8 7" fill="none" marker-end="url(#g)"/>

  <!-- the rule -->
  <rect x="40" y="410" width="1440" height="110" rx="16" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="80" y="450" fill="#71717a" font-size="15" font-weight="600" letter-spacing="1.5">THE ONE RULE</text>
  <g font-size="24" font-weight="700" text-anchor="middle">
    <rect x="80" y="464" width="330" height="44" rx="22" fill="#eef7d6"/>
    <text x="245" y="494" fill="#164B1E">Pieces on shelves</text>
    <text x="450" y="495" fill="#71717a">+</text>
    <rect x="490" y="464" width="240" height="44" rx="22" fill="#ffffff" stroke="#71717a" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="610" y="494" fill="#18181b">Not shelved</text>
    <text x="770" y="495" fill="#71717a">=</text>
    <rect x="810" y="464" width="220" height="44" rx="22" fill="#164B1E"/>
    <text x="920" y="494" fill="#ffffff">Your stock</text>
  </g>
  <text x="1070" y="483" fill="#71717a" font-size="15">Putting away and moving never</text>
  <text x="1070" y="505" fill="#71717a" font-size="15">change your stock, only where it is.</text>
</svg>
